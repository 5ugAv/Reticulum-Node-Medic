name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest PyYAML Pillow
      - name: Run the test suite
        # The tested core still has no third-party RUNTIME deps — Kivy is only
        # for the UI, which the suite does not import. PyYAML is a TEST-ONLY
        # dependency: test_cloud_init_seed parses the cloud-init user-data the
        # imager generates, to check it independently rather than trusting the
        # string we just built. Pillow likewise — test_terrain builds terrarium
        # elevation tiles and reads a known height back out, which is how the
        # MBTiles row-flip gets caught. Without it CI failed on import for every commit
        # after 88fabf0 while passing locally, because a dev machine has PyYAML
        # and the runner does not.
        run: python -m pytest -q

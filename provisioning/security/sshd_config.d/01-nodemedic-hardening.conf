# Node Medic — SSH hardening drop-in.
#
# Installs to:  /etc/ssh/sshd_config.d/01-nodemedic-hardening.conf  (root:root 0644)
#
# WHY the "01-" prefix: sshd reads sshd_config.d/*.conf in lexical order and, for
# most keywords, the FIRST value wins. Raspberry Pi OS ships 50-cloud-init.conf
# which sets `PasswordAuthentication yes` — this file must sort BEFORE it to win.
# The apply script verifies the EFFECTIVE value with `sshd -T` after install, so a
# sorting mistake is caught before password auth is actually relied upon.
#
# PRE-FLIGHT (enforced by apply_sshd.sh): ~/.ssh/authorized_keys must exist and a
# fresh key-auth login must succeed BEFORE these take effect — otherwise you lock
# yourself out (recovery needs physical access to the Pi).

# Key-only auth. Passwords + keyboard-interactive off (both are password vectors).
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# No direct root logins over SSH (the live medic had `without-password`; tighten).
PermitRootLogin no

# Belt-and-braces: no empty passwords, no host-based, no unused auth methods.
PermitEmptyPasswords no
HostbasedAuthentication no

# --- Exposure restriction (OPTIONAL — commented; see README) ----------------
# The firewall (nftables) is the recommended way to limit port 22 to the LAN,
# because the medic ROAMS between networks (its LAN subnet changes). If you keep
# the medic on ONE fixed network, you can instead bind sshd to that interface's
# address by uncommenting and editing ONE of the following. NOTE: ListenAddress
# only takes effect while sshd runs as ssh.service (it does today; ssh.socket is
# disabled). Do NOT leave a ListenAddress that the current IP doesn't match, or
# sshd won't listen at all.
#
# ListenAddress <medic-lan-ip>          # this medic's wlan0 address
# ListenAddress 10.55.0.2              # USB-gadget provisioning link only

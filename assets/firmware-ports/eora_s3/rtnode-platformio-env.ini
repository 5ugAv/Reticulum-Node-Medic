[env:ebyte_eora_s3_sx1262_boundary_local]
; Ebyte EoRa-S3-900TB (EoRa PI family): ESP32-S3FH4R2 + E22-900MM22S (raw SX1262).
;
; NOT the XIAO's flash/PSRAM settings. This part is 4MB flash with QUAD PSRAM;
; the XIAO env above is 16MB with opi/octal. A wrong flash size boot-loops an
; ESP32, and octal PSRAM settings claim GPIO 33-37 - which is exactly where
; this board's DIO1 (33), BUSY (34) and LED (37) live.
;
; 4MB is proven in this firmware: partitions_4mb_ota.csv exists precisely
; because the app is too large for default.csv, and its own header records
; ~1.19MB binary into 1.375MB app slots (~15% headroom).
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
custom_variant = ebyte_eora_s3_sx1262_boundary_local
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_4mb_ota.csv
board_build.flash_mode = dio
board_build.psram_type = qspi
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_MODEL=BOARD_EORA_S3
	-DMODEM=SX1262
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM=1
    -DFIREWALL_MODE
	-DHAS_DISPLAY=0
	; --- Firewall mode defaults (override via EEPROM at runtime) ---
	-DFIREWALL_TCP_MODE=0
	-DFIREWALL_TCP_PORT=4242
	-Wl,--print-memory-usage
lib_deps =
    ${env.lib_deps}
monitor_filters = esp32_exception_decoder

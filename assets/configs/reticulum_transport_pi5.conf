# Reticulum transport node — Raspberry Pi 5 template
# Pi 5 has ample CPU/RAM; higher announce cap and instance sharing on.

[reticulum]
enable_transport = Yes
share_instance = Yes
shared_instance_port = 37428
instance_control_port = 37429
# No. It was set to Yes on 2026-08-11 on the theory that rnsd would exit
# when its radio was missing and systemd would keep retrying. TESTED THE
# SAME NIGHT ON A REAL NODE: rnsd stayed active with NRestarts=0, so the
# premise was simply false. Left in, it does nothing on its own — and if
# anything ever DID make rnsd exit, Restart=always with no start-limit
# would turn a flapping radio into an unbounded restart loop on a node
# that is meant to be frugal with airtime.
panic_on_interface_error = No

[logging]
loglevel = 4

[interfaces]

  [[RNode LoRa Interface]]
    type = RNodeInterface
    enabled = Yes
    port = {{SERIAL_PORT}}
    frequency = {{FREQUENCY}}
    bandwidth = {{BANDWIDTH}}
    txpower = {{TXPOWER}}
    spreadingfactor = {{SF}}
    codingrate = {{CR}}
    id_callsign = RTT-PI5

  # The Pi's strength over an RTNode: it BRIDGES. LoRa on one side, the local
  # network on the other — so health beacons reach the medic over Wi-Fi even
  # before the radio is fitted, and traffic crosses between the mesh and the
  # LAN/internet. (Operator, 2026-08-12: "the node with pi's strength over
  # rtnode is that it can propagate messages and also bridge lora wifi
  # Internet".)
  [[LAN Interface]]
    type = AutoInterface
    enabled = Yes

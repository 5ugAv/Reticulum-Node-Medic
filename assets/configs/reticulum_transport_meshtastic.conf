# Reticulum transport + Meshtastic bridge template
# Adds a Meshtastic interface alongside the RNode LoRa interface.

[reticulum]
enable_transport = Yes
share_instance = Yes
shared_instance_port = 37428
instance_control_port = 37429
# Yes, DELIBERATELY. The radio is attached to the node AFTER the build
# — that is the physical order on a Pi 3 A+, which has one USB-A socket
# and the medic's cable in it. With No, rnsd shrugs at a missing radio,
# stays up with a dead interface and never looks again: SolarLove and
# 2k13 both went out that way (2026-08-10). With Yes it exits, and
# systemd's Restart=always brings it straight back — so the node simply
# retries every few seconds until its radio exists, whether that is two
# seconds or two days later.
panic_on_interface_error = Yes

[logging]
loglevel = 4

[interfaces]

  [[RNode LoRa Interface]]
    type = RNodeInterface
    enabled = Yes
    port = {{SERIAL_PORT}}
    frequency = {{FREQUENCY}}
    bandwidth = {{BANDWIDTH}}
    txpower = {{TXPOWER}}
    spreadingfactor = {{SF}}
    codingrate = {{CR}}
    id_callsign = RTT-BRIDGE

  [[Meshtastic Bridge Interface]]
    type = TCPClientInterface
    enabled = Yes
    target_host = 127.0.0.1
    target_port = 4403

# Node Medic: keep NetworkManager's hands off the cable-birth link.
#
# Install to /etc/NetworkManager/conf.d/99-nodemedic-usb0.conf (root, 0644).
#
# WHY. When a Pi is plugged in for a cable birth it appears on the medic as a
# USB ethernet device, usb0. NetworkManager sees a new wired interface, invents
# a "Wired connection N" for it and runs DHCP. There is no DHCP server: the
# cable link is a static /29 that the medic configures itself (10.55.0.2 to the
# node's 10.55.0.1). So NM waits 45 seconds, fails with
# ip-config-unavailable, tears the interface down, and starts again.
#
# That churn wipes the address discover_peer just set, and the interface
# thrashing wedges the gadget's transmit queue:
#
#     cdc_ether usb0: NETDEV WATCHDOG: transmit queue 0 timed out
#
# which is what killed SkyFinger's build twice on 2026-08-11, and had been
# blamed on power, on a cable, on the Pi, and on two different medic USB ports.
# The medic's own rail was clean throughout and the node side was flawless.
#
# THE SAME BUG WAS FIXED ON THE NODE SIDE LONG AGO — the card marks usb0
# unmanaged there for exactly this reason. Nobody ever did it on the medic,
# which is the half nobody thinks about because the medic is "the tool", not
# "the node".
[keyfile]
unmanaged-devices=interface-name:usb0

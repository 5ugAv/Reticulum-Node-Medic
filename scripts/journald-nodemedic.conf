# Node Medic keeps the system journal across reboots, so Self Diagnose can
# count what happened on earlier boots: the screen panel's re-initialisations,
# a clock jump, a service that died. Bounded, so an SD card never fills.
# Installed by the clone and the GitHub setup (workflows/clone.py,
# configure_autostart) as /etc/systemd/journald.conf.d/50-nodemedic.conf.
[Journal]
Storage=persistent
SystemMaxUse=100M
SystemMaxFileSize=20M

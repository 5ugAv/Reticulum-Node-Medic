# Gate rnsd behind the encrypt-at-rest vault. Installed to
# /etc/systemd/system/rnsd.service.d/vault.conf by scripts/vault_enable_boot.sh.
# rnsd reads ~/.reticulum/storage/transport_identity, which lives inside the
# vault once migrated; it must not start until the vault is mounted.
[Unit]
After=nodemedic-vault.service
Requires=nodemedic-vault.service
